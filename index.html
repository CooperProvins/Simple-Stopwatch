<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Simple Stopwatch</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
<main>
<div class="largeContainer largeElement" id="time"></div>
<div id="setupButtons">
    <div class="largeContainer" id="doubleButton">
        <button class="largeElement squareButton" id="countdown" onclick="setCountdown()">COUNTDOWN</button>
        <button class="largeElement squareButton" id="start" onclick="setRunning()">START</button>
    </div>
    <button class="largeContainer largeElement squareButton" id="pause" onclick="setPaused()">PAUSE</button>
    <button class="largeContainer largeElement squareButton" id="reset" onclick="setReset()">RESET</button>
</div>
</main>
    <footer>
        <p>&copy Cooper Provins '26 &emsp; <a href="https://github.com/CooperProvins">GitHub Repository</a></p>
    </footer>
</body>
</html>
